# ───────────────────────────────────────────────────────────────────────
#  Eagle Guard WAF — Nginx reverse proxy + ModSecurity (v7.4)
#  Port 8080'de dinler → upstream uygulamaya (80) yönlendirir
#  install-waf.sh tarafından /etc/nginx/conf.d/eagle-waf.conf'a kopyalanır
# ───────────────────────────────────────────────────────────────────────

# ── Rate Limit Zone'ları ─────────────────────────────────────────────
limit_req_zone  $binary_remote_addr zone=eg_global:20m  rate=60r/s;
limit_req_zone  $binary_remote_addr zone=eg_login:10m   rate=5r/m;
limit_req_zone  $binary_remote_addr zone=eg_api:10m     rate=120r/m;
limit_req_zone  $binary_remote_addr zone=eg_search:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=eg_conn:20m;

# ── Kötü Bot Tespiti — User-Agent map ───────────────────────────────
map $http_user_agent $eg_bad_bot {
    default                                                         0;
    ""                                                              1;
    "-"                                                             1;
    ~*(nikto|sqlmap|nmap|masscan|zgrab|havij|acunetix)              1;
    ~*(w3af|skipfish|arachni|openvas|dirbuster|gobuster)            1;
    ~*(wpscan|fuzz|xspider|wfuzz|jbroFuzz|burpsuite|nessus)        1;
    ~*(hydra|medusa|metasploit|msfconsole|beef|cobalt)              1;
    ~*(python-requests/[01]\.|go-http-client/1\.|curl/[0-6]\.)      1;
}

# ── Şüpheli URI Tespiti ──────────────────────────────────────────────
map $request_uri $eg_bad_uri {
    default                                                         0;
    ~*(\.\./|\.\.%2[fF]|%2e%2e)                                    1;  # Path traversal
    ~*(union.*select|select.*from|insert.*into|drop.*table)         1;  # SQLi
    ~*(<script|javascript:|vbscript:|onload=|onerror=)              1;  # XSS
    ~*(eval\(|base64_decode|system\(|exec\(|passthru\()             1;  # RCE
    ~*(\.php\?.*=http|\.php\?.*=ftp|\.php\?.*=\/\/)                1;  # RFI
    ~*(/etc/passwd|/etc/shadow|/proc/self|/var/www)                 1;  # LFI
    ~*(\/\.git\/|\/\.env|\/\.htpasswd|\/wp-config\.php)            1;  # Sensitive files
    ~*(XDEBUG_SESSION|phpinfo\(\)|\.phtml|\.asp[x]?)               1;  # PHP attack
}

# ── HTTP Method Filtresi ─────────────────────────────────────────────
map $request_method $eg_bad_method {
    default 0;
    TRACE   1;
    CONNECT 1;
    DEBUG   1;
    TRACK   1;
}

# ── GeoIP blok map (waf-ctl.sh rebuild ile üretilir) ────────────────
map $geoip2_country_code $eg_geo_deny {
    default 0;
    include /opt/eagle-guard/waf/data/geo-map.conf;
}

# ── Under Attack Mode (UAM) — cookie bazlı bypass ───────────────────
map $cookie_eg_verified $eg_uam_pass {
    default 0;
    ~.+     1;
}

# ── Upstream hedef (install-waf.sh inject eder) ─────────────────────
upstream eg_backend {
    server 127.0.0.1:80;
    keepalive 32;
}

server {
    listen 8080 default_server;
    server_name _;

    # ── ModSecurity WAF ──────────────────────────────────────────────
    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    # ── İstek boyutu ve timeout limitleri ───────────────────────────
    client_max_body_size       32m;
    client_body_timeout        15s;
    client_header_timeout      10s;
    client_body_buffer_size    16k;
    large_client_header_buffers 4 32k;
    send_timeout               30s;

    # ── Gerçek IP (L4 arkasında) ─────────────────────────────────────
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ── Güvenlik başlıkları ──────────────────────────────────────────
    add_header X-Frame-Options         "SAMEORIGIN"           always;
    add_header X-Content-Type-Options  "nosniff"              always;
    add_header X-XSS-Protection        "1; mode=block"        always;
    add_header Referrer-Policy         "strict-origin"        always;
    add_header X-Robots-Tag            "noindex, nofollow"    always;
    server_tokens off;

    # ── Kötü bot → anında kapat (444) ───────────────────────────────
    if ($eg_bad_bot = 1)    { return 444; }
    if ($eg_bad_method = 1) { return 405; }
    if ($eg_bad_uri = 1)    { return 403; }

    # ── Threat Intelligence IP listesi ──────────────────────────────
    include /opt/eagle-guard/waf/data/ti-deny.conf;

    # ── GeoIP blok ──────────────────────────────────────────────────
    include /opt/eagle-guard/waf/data/geo-enforce.conf;

    # ── Under Attack Mode ────────────────────────────────────────────
    include /opt/eagle-guard/waf/data/uam-flag.conf;

    # ── Genel rate limit ─────────────────────────────────────────────
    limit_req  zone=eg_global burst=200 nodelay;
    limit_conn eg_conn 80;
    limit_req_status 429;
    limit_conn_status 429;

    # ── Özel endpoint limitleri ──────────────────────────────────────
    location ~* ^/(wp-login\.php|admin(?:/login)?|login|signin|auth|account) {
        limit_req zone=eg_login burst=5 nodelay;
        proxy_pass http://eg_backend;
        include /opt/eagle-guard/waf/templates/proxy-pass.inc;
    }

    location ~* ^/api/ {
        limit_req zone=eg_api burst=300 nodelay;
        proxy_pass http://eg_backend;
        include /opt/eagle-guard/waf/templates/proxy-pass.inc;
    }

    location ~* ^/(search|query|find) {
        limit_req zone=eg_search burst=20 nodelay;
        proxy_pass http://eg_backend;
        include /opt/eagle-guard/waf/templates/proxy-pass.inc;
    }

    # ── Hassas dosya erişimi → 403 ──────────────────────────────────
    location ~* \.(env|git|sql|bak|backup|old|orig|htpasswd|htaccess)$ {
        return 403;
    }
    location ~* /(\.git|\.svn|\.hg|\.bzr|\.env|vendor/composer)/ {
        return 403;
    }

    # ── Challenge sayfası (UAM / captcha) ───────────────────────────
    location = /__eg_challenge {
        root /opt/eagle-guard/waf/templates;
        try_files /challenge.html =500;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
    location = /__eg_verify {
        proxy_pass http://127.0.0.1:80/eagle-guard/api/index.php?action=waf_verify;
        include /opt/eagle-guard/waf/templates/proxy-pass.inc;
    }

    # ── Sağlık kontrolü ─────────────────────────────────────────────
    location = /__eg_status {
        access_log off;
        return 200 "eagle-waf-ok\n";
        add_header Content-Type text/plain;
    }

    # ── Varsayılan → upstream ────────────────────────────────────────
    location / {
        proxy_pass http://eg_backend;
        include /opt/eagle-guard/waf/templates/proxy-pass.inc;
    }

    # ── ModSecurity denetim logu ─────────────────────────────────────
    modsecurity_rules '
        SecAuditLog /opt/eagle-guard/waf/logs/audit.log
        SecAuditEngine RelevantOnly
        SecAuditLogParts ABIJDEFHZ
        SecAuditLogType Serial
        SecResponseBodyMimeType text/plain text/html text/xml application/json
    ';

    # ── Erişim / hata log ────────────────────────────────────────────
    access_log /opt/eagle-guard/waf/logs/access.log combined;
    error_log  /opt/eagle-guard/waf/logs/error.log  warn;
}
