# ─────────────────────────────────────────────────────────────────
#  Eagle Guard WAF Konfigürasyonu (v7.4)
# ─────────────────────────────────────────────────────────────────

# Genel
WAF_ENABLED=yes
WAF_MODE=block             # block | detect (detect = sadece logla)
WAF_LISTEN_PORT=8080       # Nginx WAF proxy dinleyeceği port (arkaya yönlendirir)
WAF_UPSTREAM=http://127.0.0.1:80   # Arkadaki uygulama
WAF_PARANOIA=2             # OWASP CRS paranoia seviyesi (1-4, yüksek = katı)
WAF_ANOMALY_INBOUND=8      # İnbound anomaly threshold
WAF_ANOMALY_OUTBOUND=6

# Under Attack Mode
UAM_ENABLED=no             # açıkken tüm trafik JS challenge'den geçer
UAM_COOKIE_TTL=3600        # saniye
UAM_SECRET=eagle-guard-waf-secret-2026

# Rate limiting (endpoint bazı)
WAF_RATE_GLOBAL=200r/s     # IP başı toplam hız
WAF_RATE_LOGIN=10r/m       # /login, /wp-login vb.
WAF_RATE_API=500r/m

# GeoIP
GEO_ENABLED=no             # Başlangıçta kapalı (GeoIP DB gerekli)
GEO_MODE=blacklist         # blacklist | whitelist
GEO_COUNTRIES=             # Örnek: CN,RU,KP,IR
GEO_DB_PATH=/opt/eagle-guard/waf/data/GeoLite2-Country.mmdb

# Threat Intelligence (IP reputation feed)
TI_ENABLED=no              # Başlangıçta kapalı
TI_FEEDS=spamhaus-drop,firehol-level1,tor-exits
TI_UPDATE_INTERVAL=21600   # 6 saat
TI_AUTO_BLOCK=no           # Otomatik bloklamayı kapat

# Custom rules flag dosyaları
WAF_CUSTOM_RULES=/opt/eagle-guard/waf/rules/custom.json

# Bot tespiti
BOT_UA_BLOCK=yes           # kötü bot User-Agent patterns
BOT_UA_PATTERNS=nikto,sqlmap,nmap,masscan,zgrab,havij,acunetix,w3af,skipfish,arachni,openvas,dirbuster,gobuster,fuzz,wpscan

# Loglama
WAF_LOG_AUDIT=/opt/eagle-guard/waf/logs/audit.log
WAF_LOG_BLOCK=/opt/eagle-guard/waf/logs/block.log
WAF_LOG_MAX_SIZE=100M

# Challenge
CHALLENGE_DIFFICULTY=4     # PoW zorluğu: çözüm süresi ~50-200ms
