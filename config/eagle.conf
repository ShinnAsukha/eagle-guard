# ═════════════════════════════════════════════
#  XDP / eBPF katmanı (v7.2)
# ═════════════════════════════════════════════
#  KRİTİK: SSH (22) ve web (80/443) XDP tarafından
#  HİÇBİR KOŞULDA DROP edilmez — koruma kodda SABİT.
XDP_ENABLED=no
XDP_IFACE=auto                 # auto | eth0 | enp3s0 ...
XDP_MODE=generic               # generic | native | offload
XDP_PPS_LIMIT=0                # kaynak-IP UDP/ICMP pps (0 = kapalı)
XDP_SYN_LIMIT=0                # kaynak-IP SYN pps   (0 = kapalı)

# Ek yönetim portları (her zaman XDP_PASS)
ADMIN_PORT_SSH=22
ADMIN_PORT_WEB=80
ADMIN_PORT_WEB2=443

# ═════════════════════════════════════════════
#  DPDK katmanı (v7.2) — gelişmiş kullanım
# ═════════════════════════════════════════════
#  UYARI: DPDK bir NIC'i kernel'den koparır.
#  Sadece AYRI (yönetim dışı) NIC'e bind edin.
DPDK_ENABLED=no
DPDK_IFACE=                    # örn. eth1 (yönetim NIC'i DEĞİL)
DPDK_DRIVER=vfio-pci           # vfio-pci | uio_pci_generic
DPDK_HUGEPAGES=512             # 2MB sayfa sayısı
